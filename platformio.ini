; WuaDVI-examples — demo catalogue for the WuaDVI board.
;
; One environment per demo. Build and flash the one you want:
;
;     pio run -e 02-dashboard -t upload
;     pio device monitor
;
; The display mode is NOT a build option: WuaDVI-lib selects it at runtime, so
; every demo runs at every resolution. Each one starts in a mode that suits it
; and remembers whatever you switch to afterwards.

[platformio]
src_dir = examples
default_envs = 02-dashboard

[env]
; pioarduino 55.03.37 pinned — the exact platform the WuaDVI bring-up was
; validated with.
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; 3 MB app partition, no OTA — the display-engine firmware payload lives in the
; app image.
board_build.partitions = huge_app.csv

build_flags =
    ; Console on the native USB (Serial = USB-CDC, Serial0 = free UART0).
    ; UART0 is wired to the display engine's QSPI pins for its ROM boot and
    ; must never carry logs.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Must always carry a value: the Arduino core keys ARDUHAL_LOG_LEVEL off
    ; whether this is DEFINED, so an empty value breaks esp32-hal-log.h.
    -DCORE_DEBUG_LEVEL=1

; Pinned to an exact library commit, never a floating branch: the library pins
; the display-engine firmware in turn, and a reproducible build wants the whole
; chain fixed.
lib_deps =
    https://github.com/wualink/WuaDVI-lib.git#0771ecf0634554834d7e0cbd8530cf19c1e4db02

; ── Demos ────────────────────────────────────────────────────────────────────

[env:01-hello]
build_src_filter = +<01-hello/>

[env:02-dashboard]
build_src_filter = +<02-dashboard/>

[env:03-big-readout]
build_src_filter = +<03-big-readout/>

[env:04-console]
build_src_filter = +<04-console/>

[env:05-widgets]
build_src_filter = +<05-widgets/>
